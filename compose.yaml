name: desire-supply

x-hardened: &hardened
  read_only: true
  init: true
  restart: "no"
  logging: &bounded-logging
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges=true
  tmpfs:
