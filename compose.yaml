services:
  db:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: desire
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_superuser_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - db_superuser_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql:rw,nosuid,nodev,noexec,size=1m
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desire || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    shm_size: 128mb
    stop_grace_period: 60s

  migrate:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile
      target: platform-runtime
    image: desire-supply-platform:${DESIRE_IMAGE_TAG:-local}
    command: ["python", "-m", "desire_platform.deployment"]
    environment: *deployment-admin
    secrets:
      - db_superuser_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  taxonomy-seed:
    <<: *hardened
    image: desire-supply-platform:${DESIRE_IMAGE_TAG:-local}
    command:
      - python
      - -m
      - desire_platform.deployment.synthetic_taxonomy_seed
      - apply
    environment:
      <<: *deployment-admin
      DESIRE_TAXONOMY_SEED_WORKLOAD_CREDENTIAL_FILE: /run/secrets/taxonomy_seed_workload_credential
      DESIRE_TAXONOMY_SEED_RECEIPT_HMAC_KEY_FILE: /run/secrets/taxonomy_seed_receipt_hmac_key
    secrets:
      - db_superuser_password
      - taxonomy_seed_workload_credential
      - taxonomy_seed_receipt_hmac_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data

  online-credentials-reconcile:
    <<: *hardened
    image: desire-supply-platform:${DESIRE_IMAGE_TAG:-local}
    command:
      - python
      - -m
      - desire_platform.deployment.online_credentials
      - reconcile
    environment:
      <<: *deployment-admin
      DESIRE_INTERNAL_SANDBOX_DEPLOYMENT_CONFIG_FILE: /run/desire/online-credentials-deployment.json
    configs: *online-credential-configs
    secrets: *online-database-secrets
    depends_on:
      taxonomy-seed:
        condition: service_completed_successfully
    networks:
      - data

  online-credentials-verify:
    <<: *hardened
    image: desire-supply-platform:${DESIRE_IMAGE_TAG:-local}
    command:
      - python
      - -m
      - desire_platform.deployment.online_credentials
      - verify
    environment:
      <<: *deployment-admin
      DESIRE_INTERNAL_SANDBOX_DEPLOYMENT_CONFIG_FILE: /run/desire/online-credentials-deployment.json
    configs: *online-credential-configs
    secrets: *online-database-secrets
    depends_on:
      online-credentials-reconcile:
        condition: service_completed_successfully
    networks:
      - data

  identity-bootstrap:
    <<: *hardened
    image: desire-supply-platform:${DESIRE_IMAGE_TAG:-local}
    command:
      - python
      - -m
      - desire_platform.deployment.identity_bootstrap_orchestrator
      - run
    environment:
      <<: *deployment-admin
      DESIRE_INTERNAL_SANDBOX_DEPLOYMENT_CONFIG_FILE: /run/desire/deployment.json
      DESIRE_INTERNAL_SANDBOX_IDENTITY_BOOTSTRAP_TEMPLATE_FILE: /run/desire/identity-bootstrap-template.json
      DESIRE_INTERNAL_SANDBOX_IDENTITY_BOOTSTRAP_TEMPLATE_SHA256: b7f5326f75f17eb97cec77d92f963fe6af6755a26a1acf7af8944f33ee6ba942
      DESIRE_INTERNAL_SANDBOX_IDENTITY_BOOTSTRAP_SOURCE_ROOT: /run/identity-sources
      DESIRE_INTERNAL_SANDBOX_IDENTITY_BOOTSTRAP_OUTPUT_FILE: /run/identity-bootstrap/manifest.json
    configs: *identity-configs
    secrets: *identity-bootstrap-secrets
    volumes:
      - type: bind
        source: ${DESIRE_IDENTITY_SOURCE_DIR:-./secrets/internal-sandbox-identity-sources}
        target: /run/identity-sources
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/identity-bootstrap:rw,noexec,nosuid,nodev,size=1m,uid=10001,gid=10001,mode=0700
    depends_on:
      online-credentials-verify:
        condition: service_completed_successfully
    networks:
      - data

  synthetic-oidc:
    <<: *hardened
    image: desire-supply-platform:${DESIRE_IMAGE_TAG:-local}
    command: ["python", "-m", "desire_platform.synthetic_oidc"]
    environment:
      DESIRE_DEPLOYMENT_MODE: INTERNAL_SANDBOX
      DESIRE_EXTERNAL_PARTICIPANTS_ENABLED: "false"
      DESIRE_SYNTHETIC_OIDC_CLIENT_SECRET_FILE: /run/secrets/key-oidc-client-secret-v1
    secrets:
      - source: key-oidc-client-secret-v1
        target: key-oidc-client-secret-v1
    networks:
      - oidc-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile
      target: platform-runtime
    image: desire-supply-platform:${DESIRE_IMAGE_TAG:-local}
    command: ["python", "-m", "desire_platform.internal_pilot.api_server"]
    environment:
      DESIRE_INTERNAL_SANDBOX_DEPLOYMENT_CONFIG_FILE: /run/desire/deployment.json
      SSL_CERT_FILE: /run/desire-tls/root-ca.pem
    configs:
      - source: internal-sandbox-deployment
        target: /run/desire/deployment.json
        mode: 0444
      - source: internal-sandbox-runtime-config
        target: /run/desire/runtime-config.json
        mode: 0444
      - source: internal-sandbox-secret-manifest
        target: /run/desire/secret-manifest.json
        mode: 0444
      - source: internal-sandbox-root-ca
        target: /run/desire-tls/root-ca.pem
        mode: 0444
    secrets: *runtime-secrets
    depends_on:
      identity-bootstrap:
        condition: service_completed_successfully
      edge:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    stop_grace_period: 20s

  matching-runtime:
    <<: *hardened
    image: desire-supply-platform:${DESIRE_IMAGE_TAG:-local}
    command: ["python", "-m", "desire_platform.matching.runtime_process"]
    restart: unless-stopped
    environment:
      DESIRE_INTERNAL_SANDBOX_DEPLOYMENT_CONFIG_FILE: /run/desire/matching-deployment.json
      DESIRE_MATCHING_RUNTIME_HEALTH_FILE: /run/matching-runtime/healthy
    configs: *matching-runtime-configs
    secrets: *matching-runtime-secrets
    depends_on:
      identity-bootstrap:
        condition: service_completed_successfully
    networks:
      - data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /run/matching-runtime:rw,noexec,nosuid,nodev,size=64k,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/run/matching-runtime/healthy'); raise SystemExit(0 if p.is_file() and time.time()-p.stat().st_mtime < 30 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

  web:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    image: desire-supply-web:${DESIRE_IMAGE_TAG:-local}
    environment:
      DESIRE_LOOPBACK_BASE_URL: http://api:8000
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  edge:
    <<: *hardened
    build:
      context: .
      dockerfile: Dockerfile
      target: edge-runtime
    image: desire-supply-edge:${DESIRE_IMAGE_TAG:-local}
    depends_on:
      synthetic-oidc:
        condition: service_healthy
    configs:
      - source: internal-sandbox-edge-tls-chain
        target: /run/desire-tls/edge-tls-chain.pem
        mode: 0444
    secrets:
      - source: edge-tls-key
        target: /run/secrets/edge-tls-key.pem
        uid: "10001"
        gid: "10001"
        mode: 0400
    ports:
      - target: 443
        published: "443"
        host_ip: "127.0.0.1"
        protocol: tcp
    networks:
      app:
        aliases:
          - identity.example.test
      oidc-backend: null
      ingress: null
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/_edge/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  ingress:
  oidc-backend:
    internal: true
  app:
    internal: true
  data:
    internal: true

volumes:
  postgres-data:

