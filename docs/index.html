<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>愿作文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="愿作（Desire Supply）产品、架构、开发与运营文档">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" id="theme-style" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/theme.css">
  <script>
    const savedTheme = localStorage.getItem('desire-supply-docs-theme') || 'vue';
    document.getElementById('theme-style').href =
      `https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/${savedTheme}.css`;
  </script>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="切换明暗主题">
    <span id="theme-icon" aria-hidden="true">☀️</span>
    <span id="theme-text">浅色</span>
  </button>
  <div id="app">正在加载愿作文档…</div>
  <script>
    window.$docsify = {
      name: '愿作',
      nameLink: '/',
      repo: 'https://github.com/BillShiyaoZhang/desire-supply',
      homepage: 'index.md',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档…',
        noData: '没有找到相关内容',
        depth: 6
      },
      mermaidConfig: {
        querySelector: '.mermaid'
      }
    };

    function setTheme(theme) {
      const dark = theme === 'dark';
      document.getElementById('theme-style').href =
        `https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/${theme}.css`;
      document.body.classList.toggle('dark-mode-active', dark);
      document.getElementById('theme-icon').textContent = dark ? '🌙' : '☀️';
      document.getElementById('theme-text').textContent = dark ? '深色' : '浅色';
      localStorage.setItem('desire-supply-docs-theme', theme);
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTheme(localStorage.getItem('desire-supply-docs-theme') || 'vue');
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const current = localStorage.getItem('desire-supply-docs-theme') || 'vue';
        setTheme(current === 'vue' ? 'dark' : 'vue');
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.6/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>
</body>
</html>
