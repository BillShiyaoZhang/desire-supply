  real-oidc-caddyfile:
    file: ${DESIRE_REAL_OIDC_BUNDLE_DIR:?DESIRE_REAL_OIDC_BUNDLE_DIR is required}/config/Caddyfile.real-oidc
  real-oidc-edge-tls-chain:
