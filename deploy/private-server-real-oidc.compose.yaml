name: ${DESIRE_REAL_OIDC_PROJECT_NAME:?DESIRE_REAL_OIDC_PROJECT_NAME is required}

services:
  synthetic-oidc: !reset null

  db:
    networks: !override
      data:
        ipv4_address: ${DESIRE_REAL_OIDC_DB_DATA_IPV4:?DESIRE_REAL_OIDC_DB_DATA_IPV4 is required}

  identity-bootstrap:
    command: !override
      - python
      - -m
      - desire_platform.deployment.preprovisioned_identity_bootstrap_orchestrator
      - run
    environment: !override
      DESIRE_DEPLOYMENT_MODE: INTERNAL_SANDBOX
      DESIRE_EXTERNAL_PARTICIPANTS_ENABLED: "false"
      DESIRE_DATABASE_HOST: db
      DESIRE_DATABASE_NAME: desire
      DESIRE_DATABASE_ADMIN_USER: postgres
      DESIRE_DATABASE_PASSWORD_FILE: /run/secrets/db_superuser_password
      DESIRE_INTERNAL_SANDBOX_DEPLOYMENT_CONFIG_FILE: /run/desire/deployment.json
      DESIRE_PREPROVISIONED_OIDC_IDENTITY_BOOTSTRAP_TEMPLATE_FILE: /run/desire/identity-bootstrap-template.json
      DESIRE_PREPROVISIONED_OIDC_IDENTITY_BOOTSTRAP_TEMPLATE_SHA256: b7f5326f75f17eb97cec77d92f963fe6af6755a26a1acf7af8944f33ee6ba942
      DESIRE_PREPROVISIONED_OIDC_IDENTITY_BOOTSTRAP_SOURCE_ROOT: /run/identity-sources
      DESIRE_PREPROVISIONED_OIDC_IDENTITY_BOOTSTRAP_OUTPUT_FILE: /run/identity-bootstrap/manifest.json
    configs: !override
      - source: internal-sandbox-deployment
        target: /run/desire/deployment.json
        mode: 0444
      - source: internal-sandbox-runtime-config
        target: /run/desire/runtime-config.json
        mode: 0444
      - source: internal-sandbox-secret-manifest
        target: /run/desire/secret-manifest.json
        mode: 0444
      - source: internal-sandbox-identity-template
        target: /run/desire/identity-bootstrap-template.json
        mode: 0444
    secrets: !override
      - source: db_superuser_password
        target: db_superuser_password
      - source: key-oidc-subject-digest-v1
        target: key-oidc-subject-digest-v1
      - source: key-oidc-recipient-binding-v1
        target: key-oidc-recipient-binding-v1
    volumes: !override
      - type: bind
        source: ${DESIRE_REAL_OIDC_IDENTITY_SOURCE_DIR:?DESIRE_REAL_OIDC_IDENTITY_SOURCE_DIR is required}
        target: /run/identity-sources
        read_only: true
        bind:
          create_host_path: false

  oidc-egress-guard:
    build:
      context: .
      dockerfile: Dockerfile
      target: oidc-egress-guard-runtime
    image: desire-supply-oidc-egress-guard:${DESIRE_IMAGE_TAG:-local}
    entrypoint:
      - /usr/local/bin/desire-real-oidc-egress-guard
    init: true
    read_only: true
    restart: "no"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges=true
    environment:
      DESIRE_REAL_OIDC_DB_DATA_IPV4: ${DESIRE_REAL_OIDC_DB_DATA_IPV4:?DESIRE_REAL_OIDC_DB_DATA_IPV4 is required}
      DESIRE_REAL_OIDC_PINNED_PUBLIC_IPV4: ${DESIRE_REAL_OIDC_PINNED_PUBLIC_IPV4:?DESIRE_REAL_OIDC_PINNED_PUBLIC_IPV4 is required}
      DESIRE_REAL_OIDC_EGRESS_PROJECTION_SHA256: ${DESIRE_REAL_OIDC_EGRESS_PROJECTION_SHA256:?DESIRE_REAL_OIDC_EGRESS_PROJECTION_SHA256 is required}
    tmpfs:
      - /run/desire-oidc-egress:rw,noexec,nosuid,nodev,size=64k,mode=0700
    networks:
      app:
        aliases:
          - api
      data: {}
      oidc-egress: {}
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/desire-real-oidc-egress-guard
        - check
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 1s

  api:
    depends_on: !override
      identity-bootstrap:
        condition: service_completed_successfully
      oidc-egress-guard:
        condition: service_healthy
    environment: !override
      DESIRE_INTERNAL_SANDBOX_DEPLOYMENT_CONFIG_FILE: /run/desire/deployment.json
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    configs: !override
      - source: internal-sandbox-deployment
        target: /run/desire/deployment.json
        mode: 0444
      - source: internal-sandbox-runtime-config
        target: /run/desire/runtime-config.json
        mode: 0444
      - source: internal-sandbox-secret-manifest
        target: /run/desire/secret-manifest.json
        mode: 0444
    networks: !reset []
    network_mode: service:oidc-egress-guard
    extra_hosts:
      - db=${DESIRE_REAL_OIDC_DB_DATA_IPV4:?DESIRE_REAL_OIDC_DB_DATA_IPV4 is required}

  edge:
    depends_on: !override {}
    environment: !override
      DESIRE_REAL_OIDC_PILOT_HOSTNAME: ${DESIRE_REAL_OIDC_PILOT_HOSTNAME:?DESIRE_REAL_OIDC_PILOT_HOSTNAME is required}
    configs: !override
      - source: real-oidc-caddyfile
        target: /etc/caddy/Caddyfile
        mode: 0444
      - source: real-oidc-edge-tls-chain
        target: /run/desire-tls/edge-tls-chain.pem
        mode: 0444
    networks: !override
      - app
      - ingress

networks:
  oidc-backend: !reset null
  oidc-egress: {}

configs:
  internal-sandbox-deployment:
    file: ${DESIRE_REAL_OIDC_BUNDLE_DIR:?DESIRE_REAL_OIDC_BUNDLE_DIR is required}/config/deployment.json
  internal-sandbox-runtime-config:
    file: ${DESIRE_REAL_OIDC_BUNDLE_DIR:?DESIRE_REAL_OIDC_BUNDLE_DIR is required}/config/runtime-config.json
  internal-sandbox-secret-manifest:
