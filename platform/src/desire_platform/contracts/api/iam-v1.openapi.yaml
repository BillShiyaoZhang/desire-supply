        $ref: '#/components/requestBodies/RequiredReason'
      responses:
        '200':
          $ref: '#/components/responses/PlatformUserUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-ds_session
      description: Opaque BFF session handle; never exposed to JavaScript or logs.
      x-sensitive: true
      x-log-policy: redact
  parameters:
    InvitationId:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    PolicyBundleId:
      name: policy_bundle_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ConsentGrantId:
      name: consent_grant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    MembershipId:
      name: membership_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OpaqueId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stored as a keyed digest and unique within principal, command name, and
        command version. Target and the closed canonical request are payload-hashed.
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag for the command target aggregate.
      schema:
        $ref: '#/components/schemas/EntityTag'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Masked synchronizer token bound to the current BFF session.
      x-sensitive: true
      x-log-policy: redact
      schema:
        $ref: '#/components/schemas/CsrfToken'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 108
        maxLength: 1944
        pattern: '^[A-Za-z0-9_-]{64,1900}\.[A-Za-z0-9_-]{43}$'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  headers:
    NoStore:
      description: Sensitive or authentication response must not be cached.
      schema:
        type: string
        const: no-store
    TraceId:
      description: Safe trace correlation identifier.
      schema:
        $ref: '#/components/schemas/TraceId'
    ETag:
      description: Strong aggregate entity tag.
      schema:
        $ref: '#/components/schemas/EntityTag'
    SameOriginLocation:
      description: Registered same-origin relative redirect path.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^/(?!/)[A-Za-z0-9/_?&=.%~-]*$'
  requestBodies:
    RequiredReason:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ReasonRequest'
  responses:
    BadRequest:
      description: Malformed request or protocol input
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing, expired, or revoked
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated actor lacks a current policy, consent, MFA, or allowed action
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HoldAwareForbidden:
      description: >-
        The authority-increasing action is forbidden. SAFETY_HOLD_BLOCKED denotes
        an available BLOCK decision and is never used for decision unavailability.
      x-error-codes:
        - POLICY_ACCEPTANCE_REQUIRED
        - MFA_STEP_UP_REQUIRED
        - SAFETY_HOLD_BLOCKED
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource is missing or cannot be disclosed to this actor
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvitationUnavailable:
      description: Invitation is invalid, unavailable, terminal, expired, or not bound to this actor
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InvitationUnavailableError'
    Conflict:
      description: Idempotency, policy version, membership, or current state conflict
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: If-Match does not match the current aggregate version
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        ETag:
          $ref: '#/components/headers/ETag'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Structurally valid request violates a closed business contract
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate or abuse limit exceeded without account enumeration detail
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: Whole seconds before a safe retry.
          schema:
            type: integer
            minimum: 1
            maximum: 86400
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: >-
        Identity provider, safety policy, or policy configuration is unavailable,
        or a post-COMMIT driver failure has unknown outcome; success is never guessed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: Whole seconds before a safe retry, if known.
          schema:
            type: integer
            minimum: 1
            maximum: 86400
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HoldAwareServiceUnavailable:
      description: >-
        The safety decision required for an authority-increasing action could not
        be obtained; this is distinct from an available BLOCK decision.
      x-error-codes:
        - POLICY_CONFIGURATION_UNAVAILABLE
        - SAFETY_DECISION_UNAVAILABLE
        - COMMAND_OUTCOME_UNKNOWN
        - SERVICE_UNAVAILABLE
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: Whole seconds before a safe retry, if known.
          schema:
            type: integer
            minimum: 1
            maximum: 86400
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MembershipUpdated:
      description: Membership state changed
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MembershipAdminDto'
    PlatformUserUpdated:
      description: Existing OIDC/IAM user authority or session state changed
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformUserAdminDto'
  schemas:
    OpaqueId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{15,127}$'
    Timestamp:
      type: string
      format: date-time
    ContentSha256:
      type: string
      pattern: '^[a-f0-9]{64}$'
    EntityTag:
      type: string
      minLength: 4
      maxLength: 64
      pattern: '^"v[1-9][0-9]*"$'
    IdempotencyKey:
      type: string
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{15,127}$'
    CsrfToken:
      type: string
      minLength: 32
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]+$'
      x-sensitive: true
      x-log-policy: redact
    ProtocolSecret:
      type: string
      minLength: 32
      maxLength: 2048
      pattern: '^[A-Za-z0-9._~-]+$'
      writeOnly: true
      x-sensitive: true
      x-log-policy: redact
    CapabilityTokenResponse:
      type: string
      minLength: 32
      maxLength: 2048
      pattern: '^[A-Za-z0-9._~-]+$'
      description: >-
        One-time capability returned only by the issue command and its exact receipt
        replay; it is never logged, audited, or exposed by a read endpoint.
      x-sensitive: true
      x-log-policy: redact
    TraceId:
      type: string
      minLength: 16
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    UserStatus:
      type: string
      enum: [PENDING_ENROLLMENT, ACTIVE, SUSPENDED, CLOSED]
    OrganizationStatus:
      type: string
      enum: [PENDING_ADMIN, ACTIVE, SUSPENDED, CLOSED]
    OrganizationType:
      type: string
      enum: [BUSINESS, NONPROFIT, COMMUNITY, CREATOR_TEAM]
    MembershipStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, REVOKED]
    AccessInvitationStatus:
      type: string
      enum: [ISSUED, ACCEPTED, REVOKED, EXPIRED]
    SessionStatus:
      type: string
      enum: [ACTIVE, REVOKED, EXPIRED]
    ConsentStatus:
      type: string
      enum: [ACTIVE, WITHDRAWN, EXPIRED]
    AccessInvitationPurpose:
      type: string
      enum: [CREATOR_ENROLLMENT, ORGANIZATION_MEMBERSHIP]
    UserRole:
      type: string
      enum: [CREATOR]
    OrganizationRole:
      type: string
      enum: [ORG_ADMIN, DEMAND_OWNER]
    RoleCode:
      type: string
      enum:
        - CREATOR
        - ORG_ADMIN
        - DEMAND_OWNER
    PolicyKind:
      type: string
      enum: [TERMS, PRIVACY_NOTICE, COMMUNITY_TRANSACTION_COVENANT, CONSENT_TEXT]
    PolicyLegalEffect:
      type: string
      enum: [NOTICE_ACKNOWLEDGEMENT, CONTRACT_ACCEPTANCE, CONSENT_TEXT]
    PolicyDocumentStatus:
      type: string
      enum: [DRAFT, ACTIVE, SUPERSEDED, RETIRED]
    ConsentPurpose:
      type: string
      enum: [PILOT_RESEARCH, AI_ASSISTED_PROCESSING, DISCLOSE_PROFILE_FIELDS_TO_PARTY]
    ConsentScopeType:
      type: string
      enum: [PLATFORM_PARTICIPATION, ORGANIZATION, PROJECT, RECIPIENT_DISCLOSURE]
    DataCategory:
      type: string
      enum: [PROFILE, MATCHING, RESEARCH, AI_INPUT, CONTACT, PROJECT]
    ReasonCode:
      type: string
      minLength: 3
      maxLength: 64
      pattern: '^[A-Z][A-Z0-9_]{2,63}$'
    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - AUTHENTICATION_REQUIRED
        - SESSION_EXPIRED
        - AUTH_TRANSACTION_INVALID
        - AUTHENTICATION_REJECTED
        - POLICY_ACCEPTANCE_REQUIRED
        - CONSENT_REQUIRED_FOR_PURPOSE
        - MFA_STEP_UP_REQUIRED
        - RESOURCE_NOT_FOUND
        - ACCESS_INVITATION_UNAVAILABLE
        - IDEMPOTENCY_KEY_REUSED
        - POLICY_BUNDLE_CHANGED
        - MEMBERSHIP_ALREADY_EXISTS
        - INVALID_STATE_TRANSITION
        - LAST_ACTIVE_ORG_ADMIN
        - SELF_MANAGEMENT_FORBIDDEN
        - LAST_ACTIVE_ACCESS_ADMIN
        - PRECONDITION_FAILED
        - RATE_LIMITED
        - IDENTITY_PROVIDER_UNAVAILABLE
        - POLICY_CONFIGURATION_UNAVAILABLE
        - SAFETY_HOLD_BLOCKED
        - SAFETY_DECISION_UNAVAILABLE
        - COMMAND_OUTCOME_UNKNOWN
        - SERVICE_UNAVAILABLE
    FieldIssue:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9_\[\].-]+$'
        code:
          type: string
          enum: [MISSING_REQUIRED, UNKNOWN_FIELD, INVALID_TYPE, INVALID_ENUM, INVALID_FORMAT, TOO_LARGE, CONFLICT]
        message:
          type: string
          minLength: 1
          maxLength: 300
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, trace_id, field_issues]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 500
        trace_id:
          $ref: '#/components/schemas/TraceId'
        field_issues:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/FieldIssue'
        current_policy_bundle_id:
          oneOf:
            - $ref: '#/components/schemas/OpaqueId'
