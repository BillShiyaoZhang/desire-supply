openapi: 3.1.0
info:
  title: Desire Supply Identity and Access API
  version: 1.0.0-draft
  summary: IAM-01 invited access, tenancy, policy consent, and BFF session contract
  description: >-
    Versioned executable contract for the synthetic IAM-01 implementation slice.
    Contract tests are green, while API, PostgreSQL, and provider implementation
    remains in progress. This contract does not enable real identity data or a real
    identity provider. All objects are closed. Ordinary DTOs exclude secrets and
    identity-provider claims; the few explicit no-store protocol responses that
    must carry a capability, CSRF value, cookie, or provider authorization URL mark
    every such carrier as sensitive and redact-only.
  x-contract-status: contract-tests-green-implementation-in-progress
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-iam-database-access:
  ME_SELF_SUMMARY:
    operation_id: getMe
    mode: SECURITY_DEFINER
    function: iam_api.read_me_self_summary
    database_role: iam_app
    rls_scope: SELF
    search_path: [pg_catalog, iam, pg_temp]
    dynamic_sql: false
    public_execute: false
    execute_grantees: [iam_app]
    direct_organization_read: false
    organization_field_allowlist:
      - organization_id
      - public_name
      - type
      - status
      - aggregate_version
  PUBLIC_POLICY_READ:
    operation_id: getPolicyBundle
    database_role: iam_app
    rls_scope: PUBLIC_POLICY_READ
    scope_keys: [policy_bundle_id]
    allowed_statuses: [ACTIVE]
    relations: [policy_bundles, policy_documents, consent_offers]
    immutable_only: true
    global_scope: false
  POLICY_PUBLISH:
    application_command: PublishPolicyBundle
    database_role: iam_system
    rls_scope: POLICY_PUBLISH
    scope_keys: [selector_digest, policy_bundle_id]
    global_scope: false
    activation_entrypoint: application_command
    initial_release_entrypoint: PublishPolicyBundle
    fixture_direct_activation: false
    migration_direct_activation: false
servers:
  - url: /
tags:
  - name: Authentication
  - name: Access Invitations
  - name: Policies and Consent
  - name: Me and Sessions
  - name: Organization Administration
paths:
  /v1/auth/oidc/authorizations:
    post:
      tags: [Authentication]
      operationId: beginOidcAuthorization
      summary: Begin a one-time OIDC Authorization Code + PKCE transaction
      description: >-
        Protocol exception: this endpoint does not require Idempotency-Key or
        If-Match. Anonymous without a token is ordinary LOGIN; anonymous with an
        exact invitation token is ENROLLMENT. A current cookie Session plus an
        exact invitation token is STEP_UP and freezes that Session User as the
        expected User. A cookie Session without a token is accepted only with
        `reauthenticate: true`, producing a same-User STEP_UP with no invitation
        authority. Every path binds the initiating browser.
      security:
        - cookieAuth: []
        - {}
      x-auth-purpose-matrix:
        anonymous_without_invitation: LOGIN
        anonymous_with_invitation: ENROLLMENT
        cookie_without_invitation_and_reauthenticate_false: INVALID
        cookie_without_invitation_and_reauthenticate_true: STEP_UP
        cookie_with_invitation: STEP_UP
      x-step-up-expected-user-source: current_session.user_id
      x-oidc-browser-binding-cookie: __Host-ds_oidc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeginOidcAuthorizationRequest'
      responses:
        '201':
          description: Auth transaction created
          headers:
            Set-Cookie:
              description: >-
                One-transaction __Host-ds_oidc browser-binding cookie; Secure,
                HttpOnly, SameSite=Lax, Path=/, no Domain, and Max-Age=600.
              schema:
                type: string
                x-sensitive: true
                x-log-policy: redact
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeginOidcAuthorizationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/oidc/callback:
    get:
      tags: [Authentication]
      operationId: completeOidcAuthorization
      summary: Consume an OIDC callback and establish or rotate a BFF session
      description: >-
        Provider-driven protocol exception. State is required. Exactly one of
        code or error must be present; the implementation rejects all other
        combinations before creating a User or Session.
      security: []
      parameters:
        - name: __Host-ds_oidc
          in: cookie
          required: true
          description: >-
            Opaque one-transaction browser binding. It is independent of state
            and is cleared after a terminal callback.
          x-sensitive: true
          x-log-policy: redact
          schema:
            $ref: '#/components/schemas/ProtocolSecret'
        - name: state
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ProtocolSecret'
            x-sensitive: true
            x-log-policy: redact
        - name: code
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProtocolSecret'
            x-sensitive: true
            x-log-policy: redact
        - name: error
          in: query
          required: false
          schema:
            type: string
            enum:
              - access_denied
              - interaction_required
              - login_required
              - temporarily_unavailable
              - server_error
        - name: error_description
          in: query
          required: false
          description: Never copied into logs or an API error response.
          schema:
            type: string
            maxLength: 512
            x-sensitive: true
            x-log-policy: redact
      responses:
        '303':
          description: Callback consumed; redirect to the registered same-origin path
          headers:
            Location:
              $ref: '#/components/headers/SameOriginLocation'
            Set-Cookie:
              description: >-
                Rotated __Host-ds_session cookie and terminal deletion of the
                __Host-ds_oidc browser-binding cookie; values are never logged.
              schema:
                type: string
                x-sensitive: true
                x-log-policy: redact
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getSessionBootstrap
      summary: Read the current BFF session bootstrap and masked CSRF token
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current session bootstrap
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionBootstrapDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/access-invitations/inspect:
    post:
      tags: [Access Invitations]
      operationId: inspectAccessInvitation
      summary: Inspect an access invitation without putting its token in a URL
      description: >-
        Safe query over POST. It performs no persistence, sets no session, and
        creates no command receipt. Invalid, expired, revoked, accepted, or
        otherwise unavailable invitations share one external error.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectAccessInvitationRequest'
      responses:
        '200':
          description: Safe invitation preview
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInvitationPreviewDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationUnavailable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/access-invitations/{invitation_id}/accept:
    post:
      tags: [Access Invitations]
      operationId: acceptAccessInvitation
      summary: Atomically accept an invitation, exact policies, and explicit consent choices
      description: >-
        The body never accepts a capability token. The current rotated Session must
        have verified_for_invitation_id equal to the path ID and
        verified_contact_point_id equal to the invitation recipient_contact_id;
        ordinary login or a binding for another invitation/contact is rejected when
        executing a new command. If a prior execution is already COMPLETED, the same
        authenticated User/key/hash may replay the safe body before onboarding guards;
        no lost Session cookie or CSRF token is reconstructed.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptAccessInvitationRequest'
      responses:
        '200':
          description: Invitation accepted and authorization activated
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Set-Cookie:
              description: >-
                Rotated __Host-ds_session cookie on the first successful execution.
                A completed-receipt replay returns the safe JSON body only and does
                not reconstruct a lost raw Session handle or CSRF token.
              schema:
                type: string
                x-sensitive: true
                x-log-policy: redact
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInvitationAcceptanceDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/HoldAwareForbidden'
        '404':
          $ref: '#/components/responses/InvitationUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/HoldAwareServiceUnavailable'
  /v1/access-invitations/{invitation_id}/revoke:
    post:
      tags: [Access Invitations, Organization Administration]
      operationId: revokeAccessInvitation
      summary: Revoke an issued organization access invitation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Invitation is in the revoked terminal state
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessInvitationAdminDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/policy-bundles/{policy_bundle_id}:
    get:
      tags: [Policies and Consent]
      operationId: getPolicyBundle
      summary: Read an immutable policy bundle and its exact document hashes
      description: >-
        PUBLIC_POLICY_READ is limited to the exact policy_bundle_id and returns
        only an ACTIVE immutable bundle with its immutable documents and consent
        offers; the public database role has no global policy-table scope.
      security: []
      parameters:
        - $ref: '#/components/parameters/PolicyBundleId'
      responses:
        '200':
          description: Immutable policy bundle
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: Immutable public content can be cached only by its exact ETag.
              schema:
                type: string
                const: public, max-age=31536000, immutable
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyBundleDto'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me:
    get:
      tags: [Me and Sessions]
      operationId: getMe
      summary: Read the current user's field-allowlisted identity and authorization projection
      description: >-
        Uses the hardened iam_api.read_me_self_summary SECURITY DEFINER projection
        with a fixed search_path, no dynamic SQL, an organization-field allowlist,
        PUBLIC EXECUTE revoked, and execute granted only to iam_app. The ordinary
        SELF RLS scope cannot read organization rows directly.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user projection
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/policy-acceptances:
    post:
      tags: [Policies and Consent]
      operationId: acceptCurrentPolicies
      summary: Accept the current exact policy bundle after enrollment or a policy upgrade
      description: >-
        The nested policy requirement reference selects one exact stored authority
        from /me.policy_requirements. The policy bundle must be that requirement's
        locked current ACTIVE/effective bundle; no role, locale, jurisdiction, or
        selector is inferred from request order.
      x-concurrency-target: User
      x-response-etag-target: User
      x-policy-bundle-binding: EXACT_CURRENT_FOR_REQUIREMENT
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptPoliciesRequest'
      responses:
        '200':
          description: Current policy requirements are satisfied
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRequirementStatusDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/consents:
    get:
      tags: [Policies and Consent]
      operationId: listMyConsentGrants
      summary: List the current user's safe consent grants and strong entity tags
      description: >-
        This is the reload-safe source for the ConsentGrant ETag required by
        WithdrawConsent. It returns no internal recipient reference, evidence,
        Session secret, or policy body.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Safe paginated consent grants
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentGrantPageDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Policies and Consent]
      operationId: grantConsent
      summary: Grant one explicit purpose- and scope-bound consent
      description: >-
        The requirement reference selects the exact stored authority and current
        policy graph. Consent purpose, scope, categories, recipient, and expiry are
        server-derived from the immutable offer and cannot be supplied by the client.
      x-concurrency-target: User
      x-response-etag-target: ConsentGrant
      x-policy-bundle-binding: EXACT_CURRENT_FOR_REQUIREMENT
      x-consent-scope-derivation: PLATFORM_PARTICIPATION_NULL_SCOPE
      x-supported-consent-purposes: [PILOT_RESEARCH]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantConsentRequest'
      responses:
        '201':
          description: Consent grant recorded
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentGrantDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/consents/{consent_grant_id}/withdraw:
    post:
      tags: [Policies and Consent]
      operationId: withdrawConsent
      summary: Append a withdrawal for one consent grant
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ConsentGrantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Consent grant is in the withdrawn terminal state
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentGrantDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /v1/me/sessions:
    get:
      tags: [Me and Sessions]
      operationId: listMySessions
      summary: List the current user's safe session projections
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Safe paginated sessions
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPageDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/sessions/{session_id}:
    delete:
      tags: [Me and Sessions]
      operationId: revokeMySession
      summary: Revoke one of the current user's sessions
      description: Monotonic safety operation; repeated calls return the same safe terminal result.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session is revoked
          headers:
            Set-Cookie:
              description: >-
                Clears __Host-ds_session only when the revoked target is the
                current browser Session; no raw Session value is returned.
              schema:
                type: string
                x-sensitive: true
                x-log-policy: redact
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/organizations/{organization_id}:
    get:
      tags: [Organization Administration]
      operationId: getOrganizationSummary
      summary: Read a field-allowlisted organization summary and its command ETag
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Safe organization summary
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummaryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/public-name:
    post:
      tags: [Organization Administration]
      operationId: updateOrganizationPublicName
      summary: Correct the public name of one actively administered organization
      description: >-
        Requires the current Organization command ETag and recent multi-factor
        authentication. The public_name must already be trimmed, NFC-normalized,
        and contain no Unicode Cc or Cf code points.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationPublicNameRequest'
      responses:
        '200':
          description: Updated safe organization summary
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Trace-Id:
              $ref: '#/components/headers/TraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSummaryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/access-invitations:
    get:
      tags: [Organization Administration, Access Invitations]
      operationId: listOrganizationAccessInvitations
      summary: List safe organization invitation projections
